<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>PDF.js 叠印功能测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .test-container {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ccc;
        }

        canvas {
            border: 1px solid #000;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>PDF.js 叠印功能测试</h1>

    <div class="test-container">
        <h2>测试1: overprintOption = false (默认)</h2>
        <canvas id="canvas1" width="400" height="200"></canvas>
        <button onclick="testOverprint(false)">运行测试</button>
    </div>

    <div class="test-container">
        <h2>测试2: overprintOption = true</h2>
        <canvas id="canvas2" width="400" height="200"></canvas>
        <button onclick="testOverprint(true)">运行测试</button>
    </div>

    <script>
        // 模拟叠印功能测试
        function testOverprint(overprintOption) {
            const canvasId = overprintOption ? 'canvas2' : 'canvas1';
            const ctx = document.getElementById(canvasId).getContext('2d');

            // 清除画布
            ctx.clearRect(0, 0, 400, 200);

            // 绘制背景
            ctx.fillStyle = '#ffcccc';
            ctx.fillRect(50, 50, 100, 100);

            // 模拟叠印效果
            if (overprintOption) {
                // 启用叠印 - 使用Multiply混合模式
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = '#ccccff';
                ctx.fillRect(75, 75, 100, 100);

                // 恢复默认模式
                ctx.globalCompositeOperation = 'source-over';
            } else {
                // 禁用叠印 - 使用默认模式
                ctx.fillStyle = '#ccccff';
                ctx.fillRect(75, 75, 100, 100);
            }

            // 添加文字说明
            ctx.fillStyle = '#000';
            ctx.font = '14px Arial';
            ctx.fillText(`overprintOption: ${overprintOption}`, 10, 20);
            ctx.fillText('红色矩形 + 蓝色矩形（有重叠）', 10, 40);
        }

        // 初始运行测试
        testOverprint(false);
        testOverprint(true);
    </script>
</body>

</html>
