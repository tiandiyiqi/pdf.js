<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PDF.js 专色颜色显示测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 5px;
        }
        .color-swatch {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 1px solid #000;
            margin-right: 10px;
            vertical-align: middle;
        }
        .ink-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .log-output {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 3px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>PDF.js 专色颜色显示测试</h1>

    <div class="test-container">
        <h2>测试专色颜色提取和显示</h2>
        <p>这个测试验证专色是否使用PDF中定义的实际颜色值，而不是随机颜色。</p>
        
        <button onclick="simulateSpotColorDetection()">模拟专色检测</button>
        <button onclick="clearLogs()">清除日志</button>
        
        <div id="spot-colors-list">
            <h3>检测到的专色：</h3>
            <div id="ink-list"></div>
        </div>
        
        <div>
            <h3>日志输出：</h3>
            <div id="log-output" class="log-output"></div>
        </div>
    </div>

    <script type="module">
        // 模拟 ColorConverter 类
        class MockColorConverter {
            static #colorFilterConfig = {
                colors: new Map(),
                enabled: true,
                overprint: false
            };
            
            static #eventListeners = new Map();

            static addEventListener(eventName, listener) {
                if (!this.#eventListeners.has(eventName)) {
                    this.#eventListeners.set(eventName, []);
                }
                this.#eventListeners.get(eventName).push(listener);
            }

            static addSpotColor(spotName, visible = true, color = null) {
                const wasPresent = this.#colorFilterConfig.colors.has(spotName);
                this.#colorFilterConfig.colors.set(spotName, !!visible);

                if (!wasPresent) {
                    // 触发专色添加事件，包含颜色信息
                    this.#triggerEvent("spotColorAdded", {
                        name: spotName,
                        visible: !!visible,
                        color: color,
                    });
                }
                
                this.log(`添加专色: ${spotName}, 可见性: ${visible}, 颜色: ${color}`);
            }

            static #triggerEvent(eventName, data) {
                const listeners = this.#eventListeners.get(eventName);
                if (listeners) {
                    listeners.forEach(listener => listener(data));
                }
            }
            
            static log(message) {
                const logOutput = document.getElementById('log-output');
                const timestamp = new Date().toISOString();
                logOutput.textContent += `[${timestamp}] ${message}\n`;
                logOutput.scrollTop = logOutput.scrollHeight;
            }
        }

        // 模拟 PDFInkListViewer 类
        class MockPDFInkListViewer {
            constructor() {
                this.inks = [];
                this.nextId = 1;
                
                // 监听 ColorConverter 的专色添加事件
                MockColorConverter.addEventListener("spotColorAdded", (data) => {
                    this.log(`收到专色添加事件: ${JSON.stringify(data)}`);
                    this._addSpotColorToInkList(data.name, data.visible, data.color);
                });
            }
            
            log(message) {
                MockColorConverter.log(`PDFInkListViewer: ${message}`);
            }

            _addSpotColorToInkList(name, visible, color) {
                this.log(`添加专色到列表: ${name}, 可见性: ${visible}, 颜色: ${color}`);
                
                // 检查是否已经存在
                if (this.inks.some(ink => ink.name === name)) {
                    this.log(`专色 ${name} 已存在，跳过`);
                    return;
                }

                // 使用提供的颜色或生成随机颜色
                const inkColor = color || this._generateRandomColor();
                this.log(`为专色 ${name} 使用颜色: ${inkColor}`);

                // 创建新的油墨项
                const newInk = {
                    id: this.nextId++,
                    name: name,
                    color: inkColor,
                    visible: visible,
                    isGroup: false,
                };

                // 添加到油墨列表
                this.inks.push(newInk);
                this.log(`油墨列表更新，当前数量: ${this.inks.length}`);
                
                // 更新UI
                this.updateUI();
            }
            
            _generateRandomColor() {
                // 生成相对鲜艳的颜色
                const letters = "0123456789ABCDEF";
                let color = "#";
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 12) + 4];
                }
                return color;
            }
            
            updateUI() {
                const inkList = document.getElementById('ink-list');
                inkList.innerHTML = '';
                
                this.inks.forEach(ink => {
                    const inkItem = document.createElement('div');
                    inkItem.className = 'ink-item';
                    
                    const colorSwatch = document.createElement('span');
                    colorSwatch.className = 'color-swatch';
                    colorSwatch.style.backgroundColor = ink.color;
                    
                    const nameLabel = document.createElement('span');
                    nameLabel.textContent = `${ink.name} (${ink.color})`;
                    
                    inkItem.appendChild(colorSwatch);
                    inkItem.appendChild(nameLabel);
                    
                    inkList.appendChild(inkItem);
                });
            }
        }

        // 创建模拟实例
        const viewer = new MockPDFInkListViewer();

        // 测试函数
        window.simulateSpotColorDetection = function() {
            MockColorConverter.log('开始模拟专色检测...');
            
            // 模拟从PDF中提取的专色信息
            // 情况1: 有实际颜色值的专色
            MockColorConverter.addSpotColor('PANTONE 185 C', true, '#E31837');
            
            // 情况2: 有实际颜色值的专色
            MockColorConverter.addSpotColor('PANTONE 286 C', true, '#0038A8');
            
            // 情况3: 没有颜色值的专色（应该生成随机颜色）
            MockColorConverter.addSpotColor('Custom Spot Color', true, null);
            
            MockColorConverter.log('专色检测完成');
        };

        window.clearLogs = function() {
            document.getElementById('log-output').textContent = '';
        };

        // 页面加载时运行一次测试
        window.addEventListener('load', () => {
            setTimeout(() => {
                simulateSpotColorDetection();
            }, 1000);
        });
    </script>
</body>
</html>
